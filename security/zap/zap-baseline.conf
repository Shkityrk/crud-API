# Format: <ruleId>=<ACTION>
# ACTION can be FAIL (default), WARN или IGNORE

# Примеры подавления шумных правил (можно адаптировать под проект)
10021	IGNORE	.*	# Information Disclosure - Sensitive Information in URL
10032	WARN	.*	# Viewstate
90033	WARN	.*	# Loosely Scoped Cookie

