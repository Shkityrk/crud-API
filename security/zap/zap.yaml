env:
  contexts:
  - excludePaths: []
    name: baseline
    urls:
    - http://app:8080
  parameters:
    failOnError: true
    progressToStdout: false
jobs:
- parameters:
    enableTags: false
    maxAlertsPerRule: 10
  type: passiveScan-config
- parameters:
    maxDuration: 5
    url: http://app:8080
  type: spider
- parameters:
    maxDuration: 0
  type: passiveScan-wait
- parameters:
    format: Long
    summaryFile: /home/zap/zap_out.json
  rules:
  - action: IGNORE
    customMessage: '# Information Disclosure - Sensitive Information in URL'
    id: 10021
  - action: WARN
    customMessage: '# Viewstate'
    id: 10032
  - action: WARN
    customMessage: '# Loosely Scoped Cookie'
    id: 90033
  type: outputSummary
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: /zap/reports/zap-baseline.html
    reportTitle: ZAP Scanning Report
    template: traditional-html
  type: report
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: /zap/reports/zap-warnings.md
    reportTitle: ZAP Scanning Report
    template: traditional-md
  type: report
- parameters:
    reportDescription: ''
    reportDir: /zap/wrk/
    reportFile: /zap/reports/zap-baseline.json
    reportTitle: ZAP Scanning Report
    template: traditional-json
  type: report
